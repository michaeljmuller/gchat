[project]
name = "gchat-relay"
version = "0.1.0"
description = "Receives Google Workspace Events notices from Pub/Sub push and passes each to the copy of GChat that subscribed"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "google-auth>=2.35",
    "requests>=2.32",
    "cachecontrol>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
